algorithms:
  algorithm:
    args: '{}'
    args_intro: '{}'
    file: algo/algorithm.py
    intro: this is test
  deeplabv3:
    args: '{"model_name": "deeplabv3_plus.pth", "overlay_alpha": 0.5, "device": "auto"}'
    args_intro: '{"model_name": "已登记的语义分割模型名称", "overlay_alpha": "分割图融合比例（0～1）", "device":
      "运行设备：auto、cpu 或 cuda"}'
    file: algo/deeplabv3.py
    intro: 使用随包 DeepLabV3+ 权重进行部件分割，输出类别掩膜、分割图、融合图和统计。
  去雨后增强处理:
    args: '{"strength": 0.3}'
    args_intro: '{"strength": "雨丝处理强度（0～1，0 保留原图，默认 0.3）"}'
    file: algo/去雨后增强处理.py
    intro: 方向性雨丝检测与局部图像重建，保留原始分辨率和未检测为雨丝的区域。
  去雾恢复:
    args: '{"omega": 0.95, "size": 15}'
    args_intro: '{"omega": "去雾强度（0 到 1）", "size": "暗通道窗口大小（正整数）"}'
    file: algo/去雾恢复.py
    intro: 使用暗通道先验和对比度增强恢复雾天巡检图像。
  曝光校正与细节恢复:
    args: '{}'
    args_intro: '{}'
    file: algo/曝光校正与细节恢复.py
    intro: 自动识别逆光、过曝和欠曝并校正曝光。
  电气设备缺陷检测模型算法:
    args: '{"model_name": "best.pt", "input_conf":0.5}'
    args_intro: '{"model_name": "模型名", "input_conf":"置信度"}'
    file: algo/电气设备缺陷检测模型算法.py
    intro: 这是一个电气设备缺陷检测模型算法，用于检测无人机图像中的电气设备缺陷。
  电气设备语义分割模型算法:
    args: '{"model_name": "电气设备语义分割模型.pt"}'
    args_intro: '{"model_name": "模型名"}'
    file: algo/电气设备语义分割模型算法.py
    intro: 这是一个电气设备语义分割模型算法，用于对无人机图像中的电气设备进行像素级分割识别。
  逆光&曝光处理:
    args: '{}'
    args_intro: '{}'
    file: algo/逆光&曝光处理.py
    intro: 说明文档中的曝光处理入口，复用现有曝光校正与细节恢复实现。
  雨天图像处理:
    args: '{"strength": 0.3}'
    args_intro: '{"strength": "雨丝处理强度（0～1，0 保留原图，默认 0.3）"}'
    file: algo/雨天图像处理.py
    intro: 雨天图像处理入口，复用方向性雨丝检测与局部重建实现。
  语义增强:
    args: '{"model_name": "语义增强", "overlay_alpha": 0.5, "device": "auto"}'
    args_intro: '{"model_name": "已登记的语义分割模型名称", "overlay_alpha": "分割图融合比例（0～1）", "device":
      "运行设备：auto、cpu 或 cuda"}'
    file: algo/语义增强.py
    intro: 使用随包 ep025 训练权重进行部件语义分割，输出类别掩膜、分割图、融合图和统计。
  遮挡关系融合骨架:
    args: '{"model_name": "deeplabv3_plus.pth", "overlay_alpha": 0.5, "device": "auto",
      "corridor_width": 5, "max_gap_dist": 50, "other_ratio_th": 0.35, "closing_ksize":
      11, "bow": 0.35, "thickness": 3, "use_shape_prior": 1, "shape_method": "close",
      "shape_close_ksize": 31, "shape_occluder_dilate": 9, "fill_mode": "nn_cover",
      "mask_expand": 3}'
    args_intro: '{"model_name": "已登记的语义分割模型名称", "overlay_alpha": "分割图融合比例（0～1）", "device":
      "运行设备：auto、cpu 或 cuda", "corridor_width": "遮挡判定走廊宽度（1～101 像素）", "max_gap_dist":
      "片段最大桥接距离（1～2000 像素）", "other_ratio_th": "走廊内其他前景比例阈值（0～1）", "closing_ksize":
      "局部补全闭运算核大小（1～101）", "bow": "弧线弯曲系数（0～1）", "thickness": "桥接线宽（1～31 像素）", "use_shape_prior":
      "是否启用形状先验：1 开启，0 关闭", "shape_method": "形状先验：close 或 hull", "shape_close_ksize":
      "形状先验闭运算核大小（1～151）", "shape_occluder_dilate": "遮挡区域膨胀核大小（1～101）", "fill_mode":
      "补全纹理方式：nn_cover、shift 或 avg_soft", "mask_expand": "补全掩膜扩张量（0～31 像素）"}'
    file: algo/遮挡关系融合骨架.py
    intro: 部件分割、遮挡关系分析与纹理补全，输出补全掩膜、叠加图、推断重建图和统计。
